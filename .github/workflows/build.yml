name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar proyecto
        run: |
          unzip -q LiveTranslate.zip
          cd LiveTranslate/app/src/main/assets
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          cp -r vosk-model-small-en-us-0.15/* model-en-us/
          echo 1 > model-en-us/uuid
          rm -rf m.zip vosk-model-small-en-us-0.15
      - name: Compilar
        run: cd LiveTranslate && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LiveTranslate/app/build/outputs/apk/debug/app-debug.apk
